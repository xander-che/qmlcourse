name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install poetry
        run: |
          pip install poetry==1.8.3
      
      - name: Install dependencies (except jax/jaxlib)
        run: |
          poetry env use python3.9
          poetry lock --no-update
          poetry install --no-interaction --no-root --without=notebook
      
      - name: Install jax and jaxlib separately
        run: |
          poetry run pip install jaxlib==0.3.22 jax==0.3.23 -f https://storage.googleapis.com/jax-releases/jax_releases.html
      
      - name: Install remaining dependencies
        run: |
          poetry install --no-interaction
      
      - name: Build the book
        run: |
          poetry run jupyter-book build qmlcourse/
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: qmlcourse/_build/html/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
