name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      
      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter-book
          pip install numpy scipy matplotlib pandas sympy jax jaxlib -f https://storage.googleapis.com/jax-releases/jax_releases.html
      
      - name: Install course dependencies
        run: |
          pip install . || true
      
      - name: Force install tensorflow-quantum
        run: |
          pip install tensorflow-quantum==0.6.1
      
      - name: Build the book
        run: |
          jupyter-book build qmlcourse/
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: qmlcourse/_build/html/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
