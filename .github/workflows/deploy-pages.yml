name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      
      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter-book
          pip install sphinx-sitemap sphinx-jupyterbook-latex
          pip install numpy scipy matplotlib pandas sympy jax jaxlib -f https://storage.googleapis.com/jax-releases/jax_releases.html
      
      - name: Install course dependencies
        run: |
          pip install . || true
      
      - name: Force install tensorflow-quantum
        run: |
          pip install tensorflow-quantum==0.6.1
      
      - name: Replace \ket with |\rangle in all files
        run: |
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\ket{\([^}]*\)}/|\\1\\rangle/g' {} \;
          find ./qmlcourse -name "*.ipynb" -type f -exec sed -i 's/\\\\ket{\\([^}]*\\)}/|\\\\1\\\\rangle/g' {} \;
          echo "✅ Замена \\ket выполнена"
      
      - name: Clean up LaTeX commands
        run: |
          # Удаляем size команды
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\large//g' {} \;
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\small//g' {} \;
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\normalsize//g' {} \;
          
          # Заменяем \mbox на \text
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\mbox/\\text/g' {} \;
          find ./qmlcourse -name "*.ipynb" -type f -exec sed -i 's/\\\\mbox/\\\\text/g' {} \;
          
          # Заменяем \operatorname{Tr} на \text{Tr}
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\operatorname{Tr}/\\text{Tr}/g' {} \;
          
          # Исправляем \1 на \Psi
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\1/\\Psi/g' {} \;
          
          # Убираем лишние скобки
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/} }/}/g' {} \;
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/} }/}/g' {} \;
          
          # Исправляем \left{ и \right}
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\left{/{/g' {} \;
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\right}/}/g' {} \;
          
          # Убираем одиночные \left и \right
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\left//g' {} \;
          find ./qmlcourse -name "*.md" -type f -exec sed -i 's/\\right//g' {} \;
          
          echo "✅ LaTeX cleanup completed"
      
      - name: Migrate toc and build the book
        run: |
          jupyter-book toc migrate ./qmlcourse/_toc.yml -o ./qmlcourse/_toc.yml
          jupyter-book build ./qmlcourse/
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: qmlcourse/_build/html/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
