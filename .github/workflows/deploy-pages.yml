name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      
      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter-book
          pip install sphinx-sitemap sphinx-jupyterbook-latex
          pip install numpy scipy matplotlib pandas sympy jax jaxlib -f https://storage.googleapis.com/jax-releases/jax_releases.html
      
      - name: Install course dependencies
        run: |
          pip install . || true
      
      - name: Force install tensorflow-quantum
        run: |
          pip install tensorflow-quantum==0.6.1
      
      - name: Replace \ket with |\rangle using Python
        run: |
          python -c "
          import os
          import re
          for root, dirs, files in os.walk('./qmlcourse'):
              for file in files:
                  if file.endswith('.md') or file.endswith('.ipynb'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      new_content = re.sub(r'\\\\ket\{([^}]*)\}', r'|\1\\\\rangle', content)
                      if new_content != content:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                          print(f'Fixed: {path}')
          print('✅ Замена выполнена')
          "
      
      - name: Migrate toc and build the book
        run: |
          jupyter-book toc migrate ./qmlcourse/_toc.yml -o ./qmlcourse/_toc.yml
          jupyter-book build ./qmlcourse/
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: qmlcourse/_build/html/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
